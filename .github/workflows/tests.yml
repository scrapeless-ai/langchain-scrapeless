name: Tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} / LangChain Core ${{ matrix.core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            core: "0.3.68"
            standard-tests: "0.3.5"
          - python: "3.14"
            core: "1.7.6"
            standard-tests: "1.1.6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: |
          python -m pip install . "langchain-core==${{ matrix.core }}" "langchain-tests==${{ matrix.standard-tests }}" "pytest>=7.4,<9" "pytest-asyncio>=0.23,<2" "pytest-socket>=0.7,<1"
          python -m pip check
      - name: Run offline unit tests
        run: python -m pytest --disable-socket --allow-unix-socket tests/unit_tests
