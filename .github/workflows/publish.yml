name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  pypi-publish:
    name: Publish release to PyPI
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/langchain-scrapeless/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYCODE'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["poetry"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match the package version.")
          PYCODE

      - name: Install dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          poetry install

      - name: Build package
        run: |
          poetry build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
